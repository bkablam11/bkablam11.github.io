<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#avatar-bg)"/>
  <!-- Neural Net Graphic Overlay -->
  <g opacity="0.2" stroke="#38bdf8" stroke-width="1.5">
    <line x1="100" y1="100" x2="200" y2="150" />
    <line x1="200" y1="150" x2="300" y2="100" />
    <line x1="100" y1="200" x2="200" y2="150" />
    <line x1="200" y1="150" x2="300" y2="250" />
    <line x1="100" y1="300" x2="200" y2="280" />
    <line x1="200" y1="280" x2="300" y2="250" />
  </g>
  <!-- User Silhouette Avatar -->
  <circle cx="200" cy="150" r="60" fill="url(#accent-grad)" />
  <path d="M 90 340 C 90 230, 310 230, 310 340 Z" fill="url(#accent-grad)" opacity="0.9" />
  <text x="200" y="375" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0dcaf0" text-anchor="middle">Data &amp; AI Engineer</text>
</svg>
